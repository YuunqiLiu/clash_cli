name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------------
  # Unit tests (no real Mihomo needed, fast)
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest -v --tb=short -m "not integration"

  # ------------------------------------------------------------------
  # Integration tests (uses real Mihomo binary)
  #
  # 网络隔离：
  #   - Mihomo 只绑定 127.0.0.1，无 TUN，无系统代理
  #   - 测试只访问 REST API (port 19090)，不发任何代理流量
  # ------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download Mihomo binary
        run: |
          MIHOMO_VERSION="v1.19.0"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          echo "Downloading Mihomo ${MIHOMO_VERSION}..."
          wget -q "$URL" -O mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short -m integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check imports
        run: |
          pip install -e ".[dev]"
          python -c "from clash_cli.cli import main; print('OK')"
